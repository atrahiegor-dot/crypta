services:
  - type: web
    name: tasker-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tasker-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "[1248347380,999338362]"
      - key: REDIS_URL
        value: "fakeredis://"
      - key: JWT_SECRET
        generateValue: true
      - key: MINI_APP_URL
        sync: false

databases:
  - name: tasker-db
    plan: free
    databaseName: taskerdb
    user: tasker
